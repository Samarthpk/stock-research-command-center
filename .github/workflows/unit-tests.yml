name: Offline Stock Research Tests

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project requirements
        run: python -m pip install -r requirements.txt
      - name: Compile Streamlit pages and research modules
        run: python -m compileall -q app.py pages unified_research.py intelligence.py listed_universe.py global_markets.py
      - name: Run offline tests without API credentials
        run: python -m unittest discover -s tests -q
